<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La Guitarra de Eduardo</title>
  <meta name="description" content="Cancionero de Eduardo: letras y acordes para guitarra.">
  <meta name="theme-color" content="#b5532a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Guitarra">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    // Apply the saved theme before first paint.
    try { const t = JSON.parse(localStorage.getItem("prefs") || "{}").theme; if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-guitar" viewBox="0 0 24 24"><path fill="currentColor" d="M20.7 2.3a1 1 0 0 0-1.4 0l-1.6 1.6-.7-.7-1.4 1.4.7.7-3.2 3.2a5.3 5.3 0 0 0-3.4.4 3 3 0 0 0-1.3 1.6c-.3.9-1 1.3-2 1.4a3.6 3.6 0 0 0-2.4 1.1c-1.7 1.7-1.4 4.7.6 6.7s5 2.3 6.7.6a3.6 3.6 0 0 0 1.1-2.4c.1-1 .5-1.7 1.4-2a3 3 0 0 0 1.6-1.3 5.3 5.3 0 0 0 .4-3.4l3.2-3.2.7.7 1.4-1.4-.7-.7 1.6-1.6a1 1 0 0 0 0-1.4zM9.5 16a1.5 1.5 0 1 1-2.1-2.1A1.5 1.5 0 0 1 9.5 16z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="m21 21-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="m12 17.3-5.6 3.3 1.5-6.3L3 10l6.4-.6L12 3.5l2.6 5.9L21 10l-4.9 4.3 1.5 6.3z"/></symbol>
    <symbol id="i-star-o" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="m12 17.3-5.6 3.3 1.5-6.3L3 10l6.4-.6L12 3.5l2.6 5.9L21 10l-4.9 4.3 1.5 6.3z"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="19" r="1.8" fill="currentColor"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.5v13a1 1 0 0 0 1.5.9l10.2-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 12h12"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 12h12M12 6v12"/></symbol>
    <symbol id="i-dice" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></symbol>
  </svg>

  <header class="topbar">
    <div class="wrap">
      <button class="icon-btn" id="back" hidden aria-label="Volver"><svg><use href="#i-back"/></svg></button>
      <a class="brand" href="#/" id="brand">
        <svg width="26" height="26"><use href="#i-guitar"/></svg>
        <h1>La Guitarra de Eduardo</h1>
      </a>
      <span class="spacer"></span>
      <button class="icon-btn star" id="fav" hidden aria-label="Favorita" aria-pressed="false"><svg><use href="#i-star-o"/></svg></button>
      <button class="icon-btn" id="random" aria-label="Canción al azar" title="Canción al azar"><svg><use href="#i-dice"/></svg></button>
      <button class="icon-btn" id="menu-btn" aria-label="Opciones" aria-haspopup="true"><svg><use href="#i-more"/></svg></button>
    </div>
  </header>

  <div class="menu" id="menu" hidden role="menu"></div>

  <main class="wrap" id="view"></main>

  <div class="dock" id="dock" hidden>
    <div class="row">
      <div class="ctl" aria-label="Tono">
        <button class="icon-btn" data-act="tr-" aria-label="Bajar medio tono"><svg><use href="#i-minus"/></svg></button>
        <span class="val"><b id="tr-val">0</b><small>tono</small></span>
        <button class="icon-btn" data-act="tr+" aria-label="Subir medio tono"><svg><use href="#i-plus"/></svg></button>
      </div>
      <button class="play" id="play" aria-label="Desplazamiento automático"><svg><use href="#i-play"/></svg></button>
      <div class="ctl" aria-label="Velocidad">
        <button class="icon-btn" data-act="sp-" aria-label="Más lento"><svg><use href="#i-minus"/></svg></button>
        <span class="val"><b id="sp-val">3</b><small>velocidad</small></span>
        <button class="icon-btn" data-act="sp+" aria-label="Más rápido"><svg><use href="#i-plus"/></svg></button>
      </div>
    </div>
  </div>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
